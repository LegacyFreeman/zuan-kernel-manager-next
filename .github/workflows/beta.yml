# ZKM Next - Beta build
# Starts when you push a tag such as v1.1.0-beta.1  (or press "Run workflow").
# Publishes a GitHub PRE-release, which is exactly what the app's "Check for beta updates" looks for.
name: Beta

on:
  push:
    tags:
      - "v*-beta*"
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version WITHOUT the v, e.g. 1.1.0-beta.1"
        required: true
      build_type:
        description: "debug (safe default) or release (minified, closer to the stable build)"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: write

concurrency:
  group: beta
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version numbers
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"; BT="debug"
          else
            VERSION="${{ inputs.version }}"; BT="${{ inputs.build_type }}"
          fi
          BASECODE=$(grep -oP 'toIntOrNull\(\) \?: \K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "bt=$BT" >> "$GITHUB_OUTPUT"
          echo "code=$((BASECODE + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          elif [ "${{ steps.ver.outputs.bt }}" = "release" ]; then
            echo "::error::A release build needs the KEYSTORE_BASE64 secret (unsigned APKs cannot be installed)."; exit 1
          else
            echo "::warning::No KEYSTORE_BASE64 secret. APK gets a random debug key and cannot update older installs."
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          if [ "${{ steps.ver.outputs.bt }}" = "release" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew "$TASK" --stacktrace \
            -Pzkm.versionName="${{ steps.ver.outputs.name }}" \
            -Pzkm.versionCode="${{ steps.ver.outputs.code }}"

      - name: Rename APK and make checksum
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/${{ steps.ver.outputs.bt }} -name "*.apk" | head -1)
          NAME="ZKMNext-${{ steps.ver.outputs.tag }}.apk"
          mkdir -p dist && cp "$SRC" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "dist/$NAME")" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 "dist/$NAME.sha256")" >> "$GITHUB_OUTPUT"

      - name: Save APK as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*
          retention-days: 30

      - name: Create GitHub pre-release
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "Beta build ${{ steps.ver.outputs.name }}. Pre-release: can contain bugs."
            echo
            echo "### Changes"
            if [ -n "$PREV" ]; then git log "$PREV..HEAD" --pretty='- %s (%h)' | head -40; else git log -n 20 --pretty='- %s (%h)'; fi
            echo
            echo "### SHA-256"
            echo '```'
            cat "dist/${{ steps.apk.outputs.name }}.sha256"
            echo '```'
          } > notes.md
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/* --title "ZKM Next $TAG" \
            --notes-file notes.md --prerelease --target "$GITHUB_SHA"

      - name: Send to Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          COMMITS=$(git log -n 5 --pretty='• %s' | esc | cut -c1-120)
          URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
          CAPTION=$(printf '<b>ZKM Next Beta</b>\n<code>%s</code>\n\n%s\n\nSHA-256: <code>%s</code>\n<a href="%s">Open release page</a>' \
            "${{ steps.ver.outputs.name }}" "$COMMITS" "${{ steps.apk.outputs.sha }}" "$URL")
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          if [ "${{ steps.apk.outputs.size }}" -lt 49000000 ]; then
            curl -sS --fail-with-body "$API/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT_ID" -F parse_mode=HTML \
              -F caption="$CAPTION" -F document=@"dist/${{ steps.apk.outputs.name }}" > /dev/null
          else
            curl -sS --fail-with-body "$API/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" -d parse_mode=HTML \
              --data-urlencode text="$CAPTION" > /dev/null
          fi
